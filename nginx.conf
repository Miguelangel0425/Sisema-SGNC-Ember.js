server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tipos MIME correctos para los módulos JS generados por Vite
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/javascript js;
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (necesario para que /convocatorias, /notas/detalle/xxx, etc. funcionen al refrescar)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea agresivamente los assets con hash en el nombre (JS/CSS/fuentes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}